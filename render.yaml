services:
  - type: web
    name: pseudogram-automation-api
    runtime: docker
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: WEBHOOK_SIGNATURE_REQUIRED
        value: "true"

  - type: worker
    name: pseudogram-automation-worker
    runtime: docker
    dockerCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: WEBHOOK_SIGNATURE_REQUIRED
        value: "true"

