services:
  - type: web
    name: pseudogram-automation-free
    runtime: docker
    plan: free
    dockerCommand: sh start-free-render.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: WEBHOOK_SIGNATURE_REQUIRED
        value: "true"
