services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pseudogram
      POSTGRES_USER: pseudogram
      POSTGRES_PASSWORD: pseudogram
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pseudogram -d pseudogram"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://pseudogram:pseudogram@db:5432/pseudogram
      PSEUDOGRAM_API_KEY: ${PSEUDOGRAM_API_KEY}
      WEBHOOK_SIGNATURE_REQUIRED: ${WEBHOOK_SIGNATURE_REQUIRED:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://pseudogram:pseudogram@db:5432/pseudogram
      PSEUDOGRAM_API_KEY: ${PSEUDOGRAM_API_KEY}
    depends_on:
      db:
        condition: service_healthy

